{% extends "base.html" %}
{% block content %}
<header class="mt-8 mb-8">
  <h1 class="text-3xl font-bold">Softball Rotation</h1>
  <p class="text-slate-600 mt-1">Fair defensive rotation for pickup softball.</p>
</header>

{% if error == "notfound" %}
  <div class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
    No game found with that code. Double-check and try again.
  </div>
{% endif %}

<form action="/join" method="get" class="space-y-3 mb-8">
  <label class="block text-sm font-medium text-slate-700">Join existing game</label>
  <input name="code" placeholder="ABCD" required maxlength="4"
         pattern="[A-Za-z]{4}"
         autocapitalize="characters" autocomplete="off"
         class="w-full p-4 rounded-lg border border-slate-300 text-2xl uppercase font-mono tracking-widest text-center">
  <button class="w-full bg-slate-700 hover:bg-slate-800 text-white py-4 rounded-lg text-lg font-semibold">
    Join
  </button>
</form>

<div class="border-t border-slate-200 pt-6">
  <form action="/games/new" method="post" class="space-y-3">
    <label class="block text-sm font-medium text-slate-700">Your team name</label>
    <input name="team_name" placeholder="e.g. Bombers" required maxlength="16"
           class="w-full p-3 rounded-lg border border-slate-300">
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-lg text-lg font-semibold">
      Create new game
    </button>
  </form>
</div>
{% endblock %}
