<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Softball Rotation{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-ws@2.0.2/ws.js"></script>
  <style>
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .chevron { display: inline-block; transition: transform 0.15s ease; }
    details[open] > summary .chevron { transform: rotate(90deg); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased">
  <main class="max-w-md mx-auto p-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
