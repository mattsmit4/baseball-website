<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Softball Team Tracker{% endblock %}</title>
  <meta name="description" content="Softball Team Tracker — fair defensive rotation tracker for rec and pickup softball teams. Share a 4-letter code with your team and track innings, bench rotation, and the scoreboard live across every phone.">
  <meta name="keywords" content="softball, rec softball, pickup softball, softball team tracker, softball rotation, softball lineup, defensive rotation, softball app">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Softball Team Tracker">
  <meta property="og:description" content="Fair defensive rotation tracker for rec and pickup softball teams. Share live with your team via a 4-letter game code.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/favicon.svg">
  <script>
    if (localStorage.getItem('theme') !== 'light') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-ws@2.0.2/ws.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .chevron { display: inline-block; transition: transform 0.15s ease; }
    details[open] > summary .chevron { transform: rotate(90deg); }
    .font-display { font-family: 'Oswald', system-ui, sans-serif; letter-spacing: 0.02em; }
    .score-glow { text-shadow: 0 0 12px rgba(251, 191, 36, 0.55), 0 0 4px rgba(251, 191, 36, 0.4); }
    @keyframes fadeIn {
      from { opacity: 0.55; transform: translateY(-2px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .score-tile { animation: fadeIn 0.22s ease-out; }
    body { background: #f8fafc; }
    html.dark body {
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(251, 191, 36, 0.06), transparent 70%),
        #020617;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="text-slate-900 dark:text-slate-100 min-h-screen antialiased">
  <button id="theme-toggle" type="button"
          onclick="
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
          "
          aria-label="Toggle theme"
          class="fixed top-3 right-3 z-50 w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 shadow-md hover:scale-110 transition-transform">
    <svg class="w-5 h-5 text-amber-500 dark:hidden" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
      <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
    </svg>
    <svg class="w-5 h-5 text-amber-300 hidden dark:inline" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
    </svg>
  </button>
  <main class="max-w-md mx-auto p-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
